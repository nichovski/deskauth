[package]
name = "deskauth"
version = "0.1.0"
description = "Desktop TOTP authenticator"
authors = ["Bogdan Nichovski"]
license = "MIT"
edition = "2024"

[lib]
# The `_lib` suffix keeps the lib name unique from the bin name.
name = "deskauth_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-single-instance = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
argon2 = "0.5"
chacha20poly1305 = "0.10"
zeroize = "1"
rand = "0.8"
base32 = "0.5"
base64 = "0.22"
hkdf = "0.12"
hmac = "0.12"
sha1 = "0.10"
sha2 = "0.10"
prost = "0.13"
url = "2"
percent-encoding = "2"
uuid = { version = "1", features = ["v4"] }
rxing = { version = "0.7", default-features = false }
image = "0.25"
nokhwa = { version = "0.10", features = ["input-native"] }
notify = "6"
toml = "0.8"
arboard = { version = "3", features = ["wayland-data-control"] }

[target.'cfg(any(target_os = "linux", target_os = "macos"))'.dependencies]
ctap-hid-fido2 = "3.6"

[target.'cfg(target_os = "linux")'.dependencies]
zbus = { version = "5", default-features = false, features = ["blocking-api", "async-io"] }
keyring = { version = "3", features = ["async-secret-service", "async-io", "crypto-rust"] }
async-io = "2"
futures-lite = "2"

[target.'cfg(target_os = "macos")'.dependencies]
security-framework = { version = "3", features = ["OSX_10_15"] }

[dev-dependencies]
qrcode = "0.14"
tempfile = "3"

[profile.release]
codegen-units = 1
lto = true
opt-level = 3
panic = "abort"
strip = true

# Keep the vault KDF tests fast in debug builds without weakening the parameters.
[profile.dev.package.argon2]
opt-level = 3

[profile.dev.package.blake2]
opt-level = 3
